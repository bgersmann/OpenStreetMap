<!doctype html>
<html lang="de">

<head>
    <meta charset="UTF-8" />
    <title>OpenStreetMap Übersicht</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="" />
    <style>
        :root {
            --accent: #ffb347;
            --card-bg: rgba(7, 17, 32, 0.85);
            --card-text: #f4f8fb;
            --muted: rgba(244, 248, 251, 0.7);
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            height: 100%;
        }

        body {
            margin: 0;
            font-family: 'Space Grotesk', 'Segoe UI', sans-serif;
            background: radial-gradient(circle at top, #0b3954 0%, #082032 55%, #050b17 100%);
            color: var(--card-text);
        }

        #app {
            position: relative;
            height: 100%;
            display: flex;
            flex-direction: column;
            padding: 0;
        }

        #map {
            flex: 1;
            width: 100%;
            border-radius: 0px;
            box-shadow: 0 20px 45px rgba(0, 0, 0, 0.4);
            overflow: hidden;
        }

        #historyControls {
            position: absolute;
            bottom: 14px;
            left: 14px;
            z-index: 999;
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px 12px;
            background: var(--card-bg);
            border-radius: 10px;
            box-shadow: 0 8px 18px rgba(0, 0, 0, 0.35);
            backdrop-filter: blur(2px);
            max-width: calc(100% - 28px);
        }

        #historyControls.hidden {
            display: none;
        }

        #historyPointSelect {
            min-width: 140px;
            max-width: 260px;
        }

        #historyStatus {
            color: var(--muted);
            font-size: 13px;
            white-space: nowrap;
        }

        .leaflet-container {
            font-family: 'Space Grotesk', 'Segoe UI', sans-serif;
        }

        .osm-point-icon {
            filter: drop-shadow(0 8px 14px rgba(0, 0, 0, 0.45));
        }

        @media (max-width: 720px) {
            #app {
                padding: 0;
            }
        }
    </style>
</head>

<body>
    <div id="app">
        <div id="map"></div>
        <div id="historyControls" class="hidden">
            <select id="historyPointSelect"></select>
            <button type="button" id="historyPrev">◀</button>
            <button type="button" id="historyNext">▶</button>
            <span id="historyStatus">0 / 0</span>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
    <script>
        (function () {
            'use strict';

            const pendingPayloads = [];
            let domReady = false;
            let mapInstance = null;
            let houseMarker = null;
            let userHasMovedMap = false;
            const pointLayer = L.layerGroup();
            const trailLayer = L.layerGroup();
            let historyRoundLayer = null;
            const defaultTrailColor = '#2f2f2f';
            const defaultIconColor = '#2f7ef6';
            const defaultCircleColor = '#0ef6cc';

            // Inline icon glyphs (Material Design paths, 24x24 viewBox) rendered as
            // colored map pins so the icon color can be chosen in the configurator.
            const iconGlyphs = {
                car: 'M18.92 6.01C18.72 5.42 18.16 5 17.5 5h-11c-.66 0-1.21.42-1.42 1.01L3 12v8c0 .55.45 1 1 1h1c.55 0 1-.45 1-1v-1h12v1c0 .55.45 1 1 1h1c.55 0 1-.45 1-1v-8l-2.08-5.99zM6.5 16c-.83 0-1.5-.67-1.5-1.5S5.67 13 6.5 13s1.5.67 1.5 1.5S7.33 16 6.5 16zm11 0c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5zM5 11l1.5-4.5h11L19 11H5z',
                firestation: 'M13.5.67s.74 2.65.74 4.8c0 2.06-1.35 3.73-3.41 3.73-2.07 0-3.63-1.67-3.63-3.73l.03-.36C5.21 7.51 4 10.62 4 14c0 4.42 3.58 8 8 8s8-3.58 8-8C20 8.61 17.41 3.8 13.5.67zM11.71 19c-1.78 0-3.22-1.4-3.22-3.14 0-1.62 1.05-2.76 2.81-3.12 1.77-.36 3.6-1.21 4.62-2.58.39 1.29.59 2.65.59 4.04 0 2.65-2.15 4.8-4.8 4.8z',
                hospital: 'M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-1 11h-4v4h-4v-4H6v-4h4V6h4v4h4v4z',
                police: 'M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm0 10.99h7c-.53 4.12-3.28 7.79-7 8.94V12H5V6.3l7-3.11v8.8z',
                parking: 'M6 3h6c2.76 0 5 2.24 5 5s-2.24 5-5 5h-3v6H6V3zm3 7h2.5c1.1 0 2-.9 2-2s-.9-2-2-2H9v4z',
                school: 'M12 3L1 9l4 2.18v6L12 21l7-3.82v-6l2-1.09V17h2V9L12 3zm6.82 6L12 12.72 5.18 9 12 5.28 18.82 9zM17 15.99l-5 2.73-5-2.73v-3.72L12 15l5-2.73v3.72z',
                post: 'M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z',
                restaurant: 'M11 9H9V2H7v7H5V2H3v7c0 2.12 1.66 3.84 3.75 3.97V22h2.5v-9.03C11.34 12.84 13 11.12 13 9V2h-2v7zm5-3v8h2.5v8H21V2c-2.76 0-5 2.24-5 4z',
                viewpoint: 'M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z',
                information: 'M11 7h2v2h-2zm0 4h2v6h-2zm1-9C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8z',
                dog: 'M4.5 12.5a2 2 0 1 1 0-4 2 2 0 0 1 0 4zm3.25-4a2 2 0 1 1 0-4 2 2 0 0 1 0 4zm8.5 0a2 2 0 1 1 0-4 2 2 0 0 1 0 4zm3.25 4a2 2 0 1 1 0-4 2 2 0 0 1 0 4zm-3.41 2.36c-.87-1.02-1.6-1.89-2.48-2.91-.46-.54-1.05-1.08-1.75-1.32-.11-.04-.22-.07-.33-.09-.25-.04-.52-.04-.78-.04s-.53 0-.79.05c-.11.02-.22.05-.33.09-.7.24-1.28.78-1.75 1.32-.87 1.02-1.6 1.89-2.48 2.91-1.31 1.31-2.92 2.76-2.62 4.79.29 1.02 1.02 2.03 2.33 2.32.73.15 3.06-.44 5.54-.44h.18c2.48 0 4.81.58 5.54.44 1.31-.29 2.04-1.31 2.33-2.32.31-2.04-1.3-3.49-2.61-4.8z',
                pin: 'M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z'
            };

            const iconCache = {};

            function escapeAttribute(value) {
                return String(value).replace(/[<>&"']/g, (char) => ({
                    '<': '&lt;', '>': '&gt;', '&': '&amp;', '"': '&quot;', "'": '&#39;'
                }[char]));
            }

            // Build a teardrop map pin with a white glyph, filled with the chosen color.
            function buildPinIcon(glyphKey, color) {
                const cacheKey = glyphKey + '|' + color;
                if (iconCache[cacheKey]) {
                    return iconCache[cacheKey];
                }

                const fill = escapeAttribute(color);
                const glyph = iconGlyphs[glyphKey];
                const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="36" height="48" viewBox="0 0 36 48">`
                    + `<path d="M18 0C9.16 0 2 7.16 2 16c0 11 16 32 16 32s16-21 16-32C34 7.16 26.84 0 18 0z" fill="${fill}" stroke="#ffffff" stroke-width="1.5"/>`
                    + `<g transform="translate(7 5) scale(0.9)" fill="#ffffff">`
                    + `<path d="${glyph}"/></g></svg>`;

                const icon = L.divIcon({
                    html: svg,
                    className: 'osm-point-icon',
                    iconSize: [36, 48],
                    iconAnchor: [18, 46],
                    popupAnchor: [0, -42]
                });

                iconCache[cacheKey] = icon;
                return icon;
            }
            const defaults = {
                latitude: 51.1657,
                longitude: 15.4515,
                zoom: 6,
                label: 'Haus'
            };
            const historyState = {
                tracks: [],
                selectedTrack: 0,
                selectedRound: 0
            };
            const historyControls = {
                container: null,
                select: null,
                prevButton: null,
                nextButton: null,
                status: null
            };

            // Debug-Meldungen an das Modul melden (sichtbar im Instanz-Debug),
            // damit sich das Verhalten in der App nachvollziehen lässt.
            const debugLog = [];
            function reportDebug(message) {
                const line = new Date().toISOString().slice(11, 23) + ' ' + message;
                debugLog.push(line);
                if (debugLog.length > 200) {
                    debugLog.shift();
                }
                try {
                    if (typeof requestAction === 'function') {
                        requestAction('DebugLog', line);
                    }
                } catch (error) {
                    // Debug darf die Karte nie beeinträchtigen
                }
            }
            window.__osmDebugLog = debugLog;

            window.addEventListener('error', (event) => {
                reportDebug('JS-Fehler: ' + event.message);
            });

            function parsePayload(data) {
                if (typeof data === 'string') {
                    try {
                        return JSON.parse(data);
                    } catch (error) {
                        console.error('Fehler beim Parsen der Daten:', error);
                        reportDebug('Payload nicht parsebar (' + data.length + ' Zeichen)');
                        return {};
                    }
                }
                return data || {};
            }

            // Erzwingt das Neuzeichnen der Canvas-Vektorebene, nachdem die
            // WebView den Puffer verworfen hat (Fokuswechsel in der App).
            function refreshMapView() {
                if (!mapInstance) {
                    return;
                }

                mapInstance.invalidateSize();

                [pointLayer, trailLayer].forEach((group) => {
                    group.eachLayer((layer) => {
                        if (typeof layer.redraw === 'function') {
                            layer.redraw();
                        }
                    });
                });

                if (historyRoundLayer && typeof historyRoundLayer.redraw === 'function') {
                    historyRoundLayer.redraw();
                }
            }

            function initializeMap(center) {
                const target = {
                    latitude: typeof center.latitude === 'number' ? center.latitude : defaults.latitude,
                    longitude: typeof center.longitude === 'number' ? center.longitude : defaults.longitude,
                    zoom: typeof center.zoom === 'number' ? center.zoom : defaults.zoom
                };

                mapInstance = L.map('map', {
                    zoomControl: false,
                    // SVG statt Canvas: die Symcon-App (Flutter) setzt die
                    // WebView-Platform-View beim Fokussieren neu zusammen.
                    // Dabei geht ein Canvas-Puffer ohne DOM-Event verloren,
                    // SVG als retained DOM wird dagegen automatisch neu
                    // gezeichnet. padding rendert über den Viewport hinaus,
                    // damit beim Verschieben keine Linien abgeschnitten sind.
                    renderer: L.svg({ padding: 0.5 })
                }).setView([target.latitude, target.longitude], target.zoom);

                // Sobald der Nutzer selbst mit der Karte interagiert, darf ein
                // Datenupdate die Ansicht nicht mehr per fitBounds zurücksetzen.
                const container = mapInstance.getContainer();
                ['pointerdown', 'touchstart', 'wheel'].forEach((eventName) => {
                    container.addEventListener(eventName, () => {
                        userHasMovedMap = true;
                    }, { passive: true });
                });

                // Die App-WebView kann den Fensterzustand beim Fokuswechsel
                // (langes Drücken auf die Kachel) verändern. Ereignisse melden
                // und Karte zur Sicherheit neu zeichnen.
                ['visibilitychange', 'pageshow', 'focus'].forEach((eventName) => {
                    const target = eventName === 'visibilitychange' ? document : window;
                    target.addEventListener(eventName, () => {
                        reportDebug('Ereignis: ' + eventName + (document.hidden ? ' (hidden)' : ''));
                        if (document.hidden) {
                            return;
                        }
                        setTimeout(refreshMapView, 100);
                    });
                });
                window.addEventListener('resize', () => {
                    reportDebug('Ereignis: resize ' + window.innerWidth + 'x' + window.innerHeight);
                });
                container.addEventListener('touchend', () => {
                    setTimeout(refreshMapView, 100);
                }, { passive: true });

                // Watchdog: meldet, wenn Marker/Routen oder die SVG-Ebene
                // unerwartet verschwinden, und repariert eine leere Ebene.
                let lastWatchdogState = '';
                setInterval(() => {
                    if (!mapInstance) {
                        return;
                    }

                    const svg = container.querySelector('.leaflet-overlay-pane svg');
                    const svgWidth = svg ? Number(svg.getAttribute('width')) : -1;
                    const svgHeight = svg ? Number(svg.getAttribute('height')) : -1;
                    const state = JSON.stringify({
                        pfade: svg ? svg.querySelectorAll('path').length : -1,
                        marker: container.querySelectorAll('.leaflet-marker-icon').length,
                        svgGroesse: svgWidth + 'x' + svgHeight,
                        karte: container.clientWidth + 'x' + container.clientHeight
                    });

                    if (state !== lastWatchdogState) {
                        lastWatchdogState = state;
                        reportDebug('Zustand: ' + state);
                    }

                    if (svg && (svgWidth <= 0 || svgHeight <= 0) && container.clientWidth > 0) {
                        reportDebug('SVG-Ebene ohne Größe – erzwinge Update');
                        mapInstance.invalidateSize();
                        mapInstance.fire('moveend');
                    }
                }, 2000);

                L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
                }).addTo(mapInstance);

                trailLayer.addTo(mapInstance);
                pointLayer.addTo(mapInstance);
                L.control.zoom({ position: 'topright' }).addTo(mapInstance);
            }

            function updateHouseMarker(house) {
                const latitude = typeof house.latitude === 'number' ? house.latitude : defaults.latitude;
                const longitude = typeof house.longitude === 'number' ? house.longitude : defaults.longitude;
                const targetZoom = typeof house.zoom === 'number' ? house.zoom : defaults.zoom;
                const label = (house.label && house.label.trim()) || defaults.label;

                if (!mapInstance) {
                    initializeMap({ latitude, longitude, zoom: targetZoom });
                }

                const coordinates = [latitude, longitude];

                if (houseMarker) {
                    houseMarker.setLatLng(coordinates).setPopupContent(`<strong>${label}</strong>`);
                } else {
                    houseMarker = L.marker(coordinates, { title: label })
                        .bindPopup(`<strong>${label}</strong>`)
                        .addTo(mapInstance);
                }
            }

            function updatePointLayer(points) {
                pointLayer.clearLayers();
                trailLayer.clearLayers();
                const validPoints = Array.isArray(points) ? points : [];

                validPoints.forEach((point, index) => {
                    if (typeof point.latitude !== 'number' || typeof point.longitude !== 'number') {
                        return;
                    }

                    const label = point.name ? point.name : 'Unbenannter Punkt';
                    const coords = [point.latitude, point.longitude];
                    const iconValue = (typeof point.icon === 'string' && point.icon.trim() !== '') ? point.icon.trim() : null;
                    const iconColor = (typeof point.iconColor === 'string' && point.iconColor.trim() !== '') ? point.iconColor.trim() : null;

                    let marker;
                    if (iconValue && Object.prototype.hasOwnProperty.call(iconGlyphs, iconValue)) {
                        marker = L.marker(coords, {
                            icon: buildPinIcon(iconValue, iconColor || defaultIconColor),
                            title: label
                        });
                    } else if (iconValue) {
                        // Backward compatibility: external icon URLs stored before inline icons existed.
                        const customIcon = L.icon({
                            iconUrl: iconValue,
                            iconSize: [32, 32],
                            iconAnchor: [16, 28],
                            popupAnchor: [0, -26],
                            className: 'osm-point-icon'
                        });
                        marker = L.marker(coords, {
                            icon: customIcon,
                            title: label
                        });
                    } else {
                        const circleColor = iconColor || defaultCircleColor;
                        marker = L.circleMarker(coords, {
                            radius: 8,
                            color: circleColor,
                            weight: 2,
                            opacity: 0.9,
                            fillColor: circleColor,
                            fillOpacity: 0.35
                        });
                    }

                    marker.addTo(pointLayer);
                    const popupHtml = `<strong>${label}</strong><br>Lat: ${point.latitude.toFixed(5)}<br>Lon: ${point.longitude.toFixed(5)}`;
                    marker.bindPopup(popupHtml);

                    const trailCoords = getTrailLatLngs(point);
                    if (trailCoords.length > 1) {
                        L.polyline(trailCoords, {
                            color: resolveTrailColor(point, index),
                            weight: 3,
                            opacity: 0.7,
                            lineJoin: 'round',
                            lineCap: 'round'
                        }).addTo(trailLayer);
                    }
                });

                updateHistoryTracks(validPoints);
            }

            function ensureHistoryControls() {
                if (historyControls.container) {
                    return;
                }

                historyControls.container = document.getElementById('historyControls');
                historyControls.select = document.getElementById('historyPointSelect');
                historyControls.prevButton = document.getElementById('historyPrev');
                historyControls.nextButton = document.getElementById('historyNext');
                historyControls.status = document.getElementById('historyStatus');

                historyControls.select.addEventListener('change', () => {
                    historyState.selectedTrack = historyControls.select.selectedIndex;
                    historyState.selectedRound = 0;
                    renderHistorySelection(true);
                });

                historyControls.prevButton.addEventListener('click', () => {
                    const selectedRounds = getSelectedRounds();
                    if (selectedRounds.length <= 1) {
                        return;
                    }

                    historyState.selectedRound = Math.min(selectedRounds.length - 1, historyState.selectedRound + 1);
                    renderHistorySelection(true);
                });

                historyControls.nextButton.addEventListener('click', () => {
                    const selectedRounds = getSelectedRounds();
                    if (selectedRounds.length <= 1) {
                        return;
                    }

                    historyState.selectedRound = Math.max(0, historyState.selectedRound - 1);
                    renderHistorySelection(true);
                });
            }

            function updateHistoryTracks(points) {
                ensureHistoryControls();

                historyState.tracks = points
                    .filter((point) => point && point.historyEligible)
                    .map((point) => ({
                        name: point.name || 'Unbenannter Verlauf',
                        rounds: getTrailRounds(point)
                    }))
                    .filter((entry) => entry.rounds.length > 0);

                historyControls.select.innerHTML = '';
                historyState.tracks.forEach((entry, index) => {
                    const option = document.createElement('option');
                    option.value = String(index);
                    option.textContent = entry.name;
                    historyControls.select.appendChild(option);
                });

                if (historyState.tracks.length === 0) {
                    historyControls.container.classList.add('hidden');
                    if (historyRoundLayer) {
                        historyRoundLayer.remove();
                        historyRoundLayer = null;
                    }
                    return;
                }

                historyControls.container.classList.remove('hidden');
                historyState.selectedTrack = Math.min(historyState.selectedTrack, historyState.tracks.length - 1);
                historyControls.select.selectedIndex = historyState.selectedTrack;

                // Auswahl über Datenupdates hinweg beibehalten, nur auf den
                // gültigen Bereich begrenzen.
                const selectedRounds = getSelectedRounds();
                historyState.selectedRound = Math.min(Math.max(historyState.selectedRound, 0), Math.max(selectedRounds.length - 1, 0));

                renderHistorySelection(false);
            }

            function getSelectedRounds() {
                const selected = historyState.tracks[historyState.selectedTrack];
                return selected && Array.isArray(selected.rounds) ? selected.rounds : [];
            }

            function renderHistorySelection(fitView) {
                const selected = historyState.tracks[historyState.selectedTrack];
                if (!selected) {
                    return;
                }

                const rounds = selected.rounds;
                if (rounds.length === 0) {
                    return;
                }

                const roundIndex = Math.min(Math.max(historyState.selectedRound, 0), rounds.length - 1);
                historyState.selectedRound = roundIndex;

                const round = rounds[roundIndex];
                const timestampText = formatTimestamp(round.timestamp);
                const distanceKm = calculateRoundDistanceKm(round.coords);
                historyControls.status.textContent = `Runde ${roundIndex + 1} / ${rounds.length}${timestampText ? ' · ' + timestampText : ''}${distanceKm !== null ? ` · ${distanceKm.toFixed(2)} km` : ''}`;

                if (!mapInstance) {
                    return;
                }

                if (historyRoundLayer) {
                    historyRoundLayer.remove();
                }

                historyRoundLayer = L.polyline(round.coords, {
                    color: '#ffb347',
                    weight: 4,
                    opacity: 0.9,
                    lineJoin: 'round',
                    lineCap: 'round'
                }).addTo(mapInstance);

                // Nur bei bewusster Auswahl (Dropdown, Vor/Zurück) heranzoomen —
                // Datenupdates im Hintergrund lassen die Ansicht unangetastet.
                if (fitView) {
                    const roundBounds = L.latLngBounds(round.coords);
                    mapInstance.fitBounds(roundBounds.pad(0.12), {
                        animate: true,
                        maxZoom: 18
                    });
                }

                historyRoundLayer.bindPopup(`<strong>${selected.name}</strong><br>Runde ${roundIndex + 1} / ${rounds.length}${timestampText ? '<br>' + timestampText : ''}${distanceKm !== null ? `<br>Distanz: ${distanceKm.toFixed(2)} km` : ''}`);
            }

            function formatTimestamp(timestamp) {
                if (typeof timestamp !== 'number' || timestamp <= 0) {
                    return '';
                }

                const date = new Date(timestamp * 1000);
                if (Number.isNaN(date.getTime())) {
                    return '';
                }

                return date.toLocaleString('de-DE');
            }

            function getTrailLatLngs(point) {
                if (!point || !Array.isArray(point.trail)) {
                    return [];
                }

                return point.trail
                    .filter((segment) => typeof segment.latitude === 'number' && typeof segment.longitude === 'number')
                    .map((segment) => [segment.latitude, segment.longitude]);
            }

            function getTrailRounds(point) {
                if (!point) {
                    return [];
                }

                let rounds = [];
                if (Array.isArray(point.trailRounds) && point.trailRounds.length > 0) {
                    rounds = point.trailRounds;
                } else {
                    const fallbackTrail = getTrailLatLngs(point);
                    if (fallbackTrail.length > 1) {
                        rounds = [point.trail];
                    }
                }

                return rounds
                    .map((round) => {
                        if (!Array.isArray(round)) {
                            return null;
                        }

                        const validSegments = round
                            .filter((segment) => typeof segment.latitude === 'number' && typeof segment.longitude === 'number');
                        if (validSegments.length < 2) {
                            return null;
                        }

                        const timestampValue = validSegments[0].timestamp ?? validSegments[validSegments.length - 1].timestamp ?? null;
                        return {
                            coords: validSegments.map((segment) => [segment.latitude, segment.longitude]),
                            timestamp: (typeof timestampValue === 'number') ? timestampValue : null
                        };
                    })
                    .filter((round) => round !== null)
                    .sort((left, right) => {
                        const leftTs = (typeof left.timestamp === 'number') ? left.timestamp : 0;
                        const rightTs = (typeof right.timestamp === 'number') ? right.timestamp : 0;
                        return rightTs - leftTs;
                    });
            }

            function getSelectedRound() {
                const rounds = getSelectedRounds();
                if (rounds.length === 0) {
                    return null;
                }

                const roundIndex = Math.min(Math.max(historyState.selectedRound, 0), rounds.length - 1);
                return rounds[roundIndex];
            }

            function calculateRoundDistanceKm(coords) {
                if (!Array.isArray(coords) || coords.length < 2) {
                    return null;
                }

                let distance = 0;
                for (let i = 1; i < coords.length; i++) {
                    distance += haversineDistanceKm(coords[i - 1], coords[i]);
                }

                return distance;
            }

            function haversineDistanceKm(from, to) {
                const radius = 6371;
                const lat1 = toRadians(from[0]);
                const lon1 = toRadians(from[1]);
                const lat2 = toRadians(to[0]);
                const lon2 = toRadians(to[1]);
                const dLat = lat2 - lat1;
                const dLon = lon2 - lon1;

                const a = Math.sin(dLat / 2) * Math.sin(dLat / 2)
                    + Math.cos(lat1) * Math.cos(lat2) * Math.sin(dLon / 2) * Math.sin(dLon / 2);
                const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
                return radius * c;
            }

            function toRadians(degrees) {
                return degrees * (Math.PI / 180);
            }

            function resolveTrailColor(point, index) {
                if (point && typeof point.trailColor === 'string' && point.trailColor.trim() !== '') {
                    return point.trailColor.trim();
                }

                return defaultTrailColor;
            }

            function shouldIncludeInZoom(point) {
                if (!point) {
                    return true;
                }

                return point.includeInZoom !== false;
            }

            // Keep viewport adjusted so that all markers remain visible.
            function fitMapToContent(house, points) {
                if (!mapInstance || userHasMovedMap) {
                    return;
                }

                const latLngs = [];

                if (Array.isArray(points)) {
                    points.forEach((point) => {
                        if (!shouldIncludeInZoom(point)) {
                            return;
                        }

                        if (typeof point.latitude === 'number' && typeof point.longitude === 'number') {
                            latLngs.push([point.latitude, point.longitude]);
                        }
                    });
                }

                const selectedRound = getSelectedRound();
                if (selectedRound) {
                    selectedRound.coords.forEach((coord) => {
                        latLngs.push(coord);
                    });
                }

                const hasHouse = typeof house.latitude === 'number' && typeof house.longitude === 'number';
                const houseCoordinates = hasHouse ? [house.latitude, house.longitude] : null;
                const fallbackZoom = typeof house.zoom === 'number' ? house.zoom : defaults.zoom;

                if (houseCoordinates) {
                    latLngs.push(houseCoordinates);
                }

                if (latLngs.length === 0) {
                    return;
                }

                if (latLngs.length === 1) {
                    mapInstance.setView(latLngs[0], fallbackZoom);
                    return;
                }

                const bounds = L.latLngBounds(latLngs);
                mapInstance.fitBounds(bounds.pad(0.12), {
                    animate: true,
                    maxZoom: 18
                });
            }

            function processPayload(payload) {
                const house = (payload && typeof payload.house === 'object' && payload.house !== null) ? payload.house : null;
                const points = (payload && Array.isArray(payload.points)) ? payload.points : null;
                reportDebug('Payload: house=' + (house ? 'ja' : 'fehlt') + ', points=' + (points ? points.length : 'fehlt'));

                // Leere oder unlesbare Nachrichten (die App stellt beim
                // Fokuswechsel den gespeicherten Visualisierungswert erneut
                // zu) dürfen vorhandene Marker und Routen nicht löschen.
                if (house === null && points === null) {
                    return;
                }

                if (house !== null) {
                    updateHouseMarker(house);
                }
                if (points !== null) {
                    updatePointLayer(points);
                }
                fitMapToContent(house || {}, points || []);
            }

            document.addEventListener('DOMContentLoaded', () => {
                domReady = true;

                if (!mapInstance) {
                    initializeMap(defaults);
                }

                while (pendingPayloads.length > 0) {
                    processPayload(pendingPayloads.shift());
                }
            });

            window.handleMessage = function (data) {
                const payload = parsePayload(data);
                if (!domReady) {
                    pendingPayloads.push(payload);
                    return;
                }
                processPayload(payload);
            };
        })();
    </script>
</body>

</html>

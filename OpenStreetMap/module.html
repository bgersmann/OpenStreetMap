<!doctype html>
<html lang="de">

<head>
    <meta charset="UTF-8" />
    <title>OpenStreetMap Übersicht</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="" />
    <style>
        :root {
            --accent: #ffb347;
            --card-bg: rgba(7, 17, 32, 0.85);
            --card-text: #f4f8fb;
            --muted: rgba(244, 248, 251, 0.7);
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            height: 100%;
        }

        body {
            margin: 0;
            font-family: 'Space Grotesk', 'Segoe UI', sans-serif;
            background: radial-gradient(circle at top, #0b3954 0%, #082032 55%, #050b17 100%);
            color: var(--card-text);
        }

        #app {
            position: relative;
            height: 100%;
            display: flex;
            flex-direction: column;
            padding: 0;
        }

        #map {
            flex: 1;
            width: 100%;
            border-radius: 0px;
            box-shadow: 0 20px 45px rgba(0, 0, 0, 0.4);
            overflow: hidden;
        }

        .leaflet-container {
            font-family: 'Space Grotesk', 'Segoe UI', sans-serif;
        }

        .osm-point-icon {
            filter: drop-shadow(0 8px 14px rgba(0, 0, 0, 0.45));
        }

        @media (max-width: 720px) {
            #app {
                padding: 0;
            }
        }
    </style>
</head>

<body>
    <div id="app">
        <div id="map"></div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
    <script>
        (function () {
            'use strict';

            const pendingPayloads = [];
            let domReady = false;
            let mapInstance = null;
            let houseMarker = null;
            const pointLayer = L.layerGroup();
            const trailLayer = L.layerGroup();
            const defaultTrailColor = '#2f2f2f';
            const defaults = {
                latitude: 51.1657,
                longitude: 15.4515,
                zoom: 6,
                label: 'Haus'
            };

            function parsePayload(data) {
                if (typeof data === 'string') {
                    try {
                        return JSON.parse(data);
                    } catch (error) {
                        console.error('Fehler beim Parsen der Daten:', error);
                        return {};
                    }
                }
                return data || {};
            }

            function initializeMap(center) {
                const target = {
                    latitude: typeof center.latitude === 'number' ? center.latitude : defaults.latitude,
                    longitude: typeof center.longitude === 'number' ? center.longitude : defaults.longitude,
                    zoom: typeof center.zoom === 'number' ? center.zoom : defaults.zoom
                };

                mapInstance = L.map('map', {
                    zoomControl: false
                }).setView([target.latitude, target.longitude], target.zoom);

                L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
                }).addTo(mapInstance);

                trailLayer.addTo(mapInstance);
                pointLayer.addTo(mapInstance);
                L.control.zoom({ position: 'topright' }).addTo(mapInstance);
            }

            function updateHouseMarker(house) {
                const latitude = typeof house.latitude === 'number' ? house.latitude : defaults.latitude;
                const longitude = typeof house.longitude === 'number' ? house.longitude : defaults.longitude;
                const targetZoom = typeof house.zoom === 'number' ? house.zoom : defaults.zoom;
                const label = (house.label && house.label.trim()) || defaults.label;

                if (!mapInstance) {
                    initializeMap({ latitude, longitude, zoom: targetZoom });
                }

                const coordinates = [latitude, longitude];

                if (houseMarker) {
                    houseMarker.setLatLng(coordinates).setPopupContent(`<strong>${label}</strong>`);
                } else {
                    houseMarker = L.marker(coordinates, { title: label })
                        .bindPopup(`<strong>${label}</strong>`)
                        .addTo(mapInstance);
                }
            }

            function updatePointLayer(points) {
                pointLayer.clearLayers();
                trailLayer.clearLayers();
                const validPoints = Array.isArray(points) ? points : [];

                validPoints.forEach((point, index) => {
                    if (typeof point.latitude !== 'number' || typeof point.longitude !== 'number') {
                        return;
                    }

                    const label = point.name ? point.name : 'Unbenannter Punkt';
                    const coords = [point.latitude, point.longitude];
                    const iconUrl = (typeof point.icon === 'string' && point.icon.trim() !== '') ? point.icon.trim() : null;

                    let marker;
                    if (iconUrl) {
                        const customIcon = L.icon({
                            iconUrl,
                            iconSize: [32, 32],
                            iconAnchor: [16, 28],
                            popupAnchor: [0, -26],
                            className: 'osm-point-icon'
                        });
                        marker = L.marker(coords, {
                            icon: customIcon,
                            title: label
                        });
                    } else {
                        marker = L.circleMarker(coords, {
                            radius: 8,
                            color: '#0ef6cc',
                            weight: 2,
                            opacity: 0.9,
                            fillColor: '#0ef6cc',
                            fillOpacity: 0.35
                        });
                    }

                    marker.addTo(pointLayer);
                    const popupHtml = `<strong>${label}</strong><br>Lat: ${point.latitude.toFixed(5)}<br>Lon: ${point.longitude.toFixed(5)}`;
                    marker.bindPopup(popupHtml);

                    const trailLatLngs = getTrailLatLngs(point);
                    if (trailLatLngs.length > 1) {
                        L.polyline(trailLatLngs, {
                            color: resolveTrailColor(point, index),
                            weight: 3,
                            opacity: 0.65,
                            lineJoin: 'round',
                            lineCap: 'round'
                        }).addTo(trailLayer);
                    }
                });

            }

            function getTrailLatLngs(point) {
                if (!point || !Array.isArray(point.trail)) {
                    return [];
                }

                return point.trail
                    .filter((segment) => typeof segment.latitude === 'number' && typeof segment.longitude === 'number')
                    .map((segment) => [segment.latitude, segment.longitude]);
            }

            function resolveTrailColor(point, index) {
                if (point && typeof point.trailColor === 'string' && point.trailColor.trim() !== '') {
                    return point.trailColor.trim();
                }

                return defaultTrailColor;
            }

            function shouldIncludeInZoom(point) {
                if (!point) {
                    return true;
                }

                return point.includeInZoom !== false;
            }

            // Keep viewport adjusted so that all markers remain visible.
            function fitMapToContent(house, points) {
                if (!mapInstance) {
                    return;
                }

                const latLngs = [];

                if (Array.isArray(points)) {
                    points.forEach((point) => {
                        if (!shouldIncludeInZoom(point)) {
                            return;
                        }

                        if (typeof point.latitude === 'number' && typeof point.longitude === 'number') {
                            latLngs.push([point.latitude, point.longitude]);
                        }

                        if (Array.isArray(point.trail)) {
                            point.trail.forEach((segment) => {
                                if (typeof segment.latitude === 'number' && typeof segment.longitude === 'number') {
                                    latLngs.push([segment.latitude, segment.longitude]);
                                }
                            });
                        }
                    });
                }

                const hasHouse = typeof house.latitude === 'number' && typeof house.longitude === 'number';
                const houseCoordinates = hasHouse ? [house.latitude, house.longitude] : null;
                const fallbackZoom = typeof house.zoom === 'number' ? house.zoom : defaults.zoom;

                if (houseCoordinates) {
                    latLngs.push(houseCoordinates);
                }

                if (latLngs.length === 0) {
                    return;
                }

                if (latLngs.length === 1) {
                    mapInstance.setView(latLngs[0], fallbackZoom);
                    return;
                }

                const bounds = L.latLngBounds(latLngs);
                mapInstance.fitBounds(bounds.pad(0.12), {
                    animate: true,
                    maxZoom: 18
                });
            }

            function processPayload(payload) {
                const house = payload.house || {};
                const points = payload.points || [];
                updateHouseMarker(house);
                updatePointLayer(points);
                fitMapToContent(house, points);
            }

            document.addEventListener('DOMContentLoaded', () => {
                domReady = true;

                if (!mapInstance) {
                    initializeMap(defaults);
                }

                while (pendingPayloads.length > 0) {
                    processPayload(pendingPayloads.shift());
                }
            });

            window.handleMessage = function (data) {
                const payload = parsePayload(data);
                if (!domReady) {
                    pendingPayloads.push(payload);
                    return;
                }
                processPayload(payload);
            };
        })();
    </script>
</body>

</html>
